<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>School Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#1e1f22; color:white; }
header { background:#5865f2; padding:12px; text-align:center; font-size:22px; font-weight:bold; }
#chatBox { height:40vh; overflow-y:auto; background:#2b2d31; margin:10px; padding:10px; border-radius:8px; }
.msg { margin-bottom:6px; }
.me { color:#57f287; }
.them { color:#faa61a; }
#controls { display:flex; margin:10px; }
#controls input { flex:1; padding:10px; border-radius:5px; border:none; }
#controls button { margin-left:6px; padding:10px; border:none; border-radius:5px; background:#5865f2; color:white; cursor:pointer; }
#videoContainer { display:flex; flex-wrap:wrap; margin:10px; gap:10px; }
video { width:48%; border-radius:8px; background:black; }
@media(max-width:700px){ video{width:100%;} }
</style>
</head>
<body>

<header>School Chat</header>

<div id="chatBox"></div>

<div id="controls">
<input id="username" placeholder="Your name">
<input id="message" placeholder="Type message">
<button onclick="sendMessage()">Send</button>
</div>

<div id="videoControls" style="margin:10px;">
<button onclick="startVideo()">Start Video</button>
<input id="peerIdInput" placeholder="Peer ID to call">
<button onclick="callPeer()">Call</button>
</div>

<div id="videoContainer">
<video id="myVideo" autoplay muted></video>
</div>

<script>
let peer = new Peer(Math.floor(Math.random()*9000+1000).toString(), { // short 4-digit ID
  host: '0.peerjs.com', port: 443, secure: true
});
let connections = {};
let localStream;

// Show your Peer ID
peer.on('open', id => addMessage('Your Peer ID: ' + id, 'me'));

// Incoming chat connections
peer.on('connection', conn => {
  connections[conn.peer] = conn;
  conn.on('data', handleIncomingData);
  conn.on('open', () => addMessage('Connected to ' + conn.peer, 'me'));
});

// Incoming video calls
peer.on('call', call => {
  if(!localStream) return alert('Start your video first!');
  call.answer(localStream);
  call.on('stream', stream => addVideo(stream));
});

// Send message
function sendMessage(){
  const name = document.getElementById('username').value || 'User';
  const msg = document.getElementById('message').value.trim();
  if(!msg) return;
  Object.values(connections).forEach(conn => conn.send({name,msg}));
  addMessage('Me: ' + msg, 'me');
  document.getElementById('message').value='';
}

// Handle incoming messages
function handleIncomingData(data){
  addMessage(data.name + ': ' + data.msg, 'them');
}

// Display messages
function addMessage(text, cls){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerText = text;
  document.getElementById('chatBox').appendChild(div);
  document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
}

// Start video
async function startVideo(){
  localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  document.getElementById('myVideo').srcObject = localStream;
}

// Call peer by ID
function callPeer(){
  const peerId = document.getElementById('peerIdInput').value.trim();
  if(!peerId) return alert('Enter a peer ID');
  if(!localStream) return alert('Start your video first!');
  const conn = peer.connect(peerId);
  connections[peerId] = conn;
  conn.on('data', handleIncomingData);
  conn.on('open', () => addMessage('Connected to ' + peerId, 'me'));
  const call = peer.call(peerId, localStream);
  call.on('stream', stream => addVideo(stream));
}

// Add remote video
function addVideo(stream){
  const v = document.createElement('video');
  v.srcObject = stream;
  v.autoplay = true;
  document.getElementById('videoContainer').appendChild(v);
}
</script>

</body>
</html>
